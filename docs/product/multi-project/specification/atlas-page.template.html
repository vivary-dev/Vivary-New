<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vivary module map</title>
  <style>
    :root{color-scheme:light dark;--background:light-dark(#fafcfa,#101412);--foreground:light-dark(#172019,#eef2ef);--border:light-dark(#adb9b0,#3c4640);--primary:light-dark(#25462e,#c2e3b4);--primary-foreground:light-dark(#ffffff,#172016)}
    body{max-width:1024px;margin:24px auto;padding:0 16px;font:14px/1.5 system-ui;background:var(--background);color:var(--foreground)}
    button,select{font:inherit}
    .btn{padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--background);color:inherit;cursor:pointer}
    button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}
    .form-select{box-sizing:border-box;display:block;width:100%;padding:8px;background:var(--background);color:var(--foreground);border:1px solid var(--border)}
    .viz-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .text-small,small{font-size:12px}
    h2,h3{font-weight:500}
    a{color:var(--primary)}
    button:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
    @media(pointer:coarse){button,select{min-height:44px}select{font-size:16px}}
  </style>
</head>
<body>
__VIVARY_ATLAS_FRAGMENT__
</body>
</html>
